{# Which connected server the page shows (session.scope): shared by the overview and the jobs page. #}
{% if session.conns | length > 1 %}
<label class="scope" title="{{ t('scope_hint') }}">{{ t("scope_label") }}
  <select id="scope">
    <option value="">{{ t("scope_all") }}</option>
    {% for c in session.conns.values() | sort(attribute="name") %}
    <option value="{{ c.server_id }}" {{ "selected" if session.scope == c.server_id }}>{{ c.name }}</option>
    {% endfor %}
  </select>
</label>
{% endif %}
